<?xml version="1.0" encoding="UTF-8"?>
<!--
  Court TileSet atlas: 10 tiles of 32x32 px in a single row.
  Tile index (x, 0):
    0  floor_light        opaque sand panel
    1  floor_dark         opaque darker sand panel
    2  line_v             white line across the tile centre (vertical)
    3  line_h             white line across the tile centre (horizontal)
    4  line_v_at_1_3      white line one third across the tile (vertical)
    5  line_v_at_2_3      white line two thirds across the tile (vertical)
    6  edge_top           white line along the tile's top edge
    7  edge_bottom        white line along the tile's bottom edge
    8  edge_left          white line along the tile's left edge
    9  edge_right         white line along the tile's right edge
  Marking tiles (2-9) have a transparent background so the floor panel shows
  through when they are painted on the CourtMarkings layer above the floor.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="320" height="32" viewBox="0 0 320 32" shape-rendering="crispEdges">
  <!-- 0 floor_light -->
  <rect x="0" y="0" width="32" height="32" fill="#f5c773"/>
  <!-- 1 floor_dark -->
  <rect x="32" y="0" width="32" height="32" fill="#e0b366"/>
  <!-- 2 line_v -->
  <rect x="79" y="0" width="2" height="32" fill="#ffffff" fill-opacity="0.62"/>
  <!-- 3 line_h -->
  <rect x="96" y="15" width="32" height="2" fill="#ffffff" fill-opacity="0.62"/>
  <!-- 4 line_v_at_1_3 -->
  <rect x="139" y="0" width="2" height="32" fill="#ffffff" fill-opacity="0.62"/>
  <!-- 5 line_v_at_2_3 -->
  <rect x="181" y="0" width="2" height="32" fill="#ffffff" fill-opacity="0.62"/>
  <!-- 6 edge_top -->
  <rect x="192" y="0" width="32" height="2" fill="#ffffff" fill-opacity="0.62"/>
  <!-- 7 edge_bottom -->
  <rect x="224" y="30" width="32" height="2" fill="#ffffff" fill-opacity="0.62"/>
  <!-- 8 edge_left -->
  <rect x="256" y="0" width="2" height="32" fill="#ffffff" fill-opacity="0.62"/>
  <!-- 9 edge_right -->
  <rect x="318" y="0" width="2" height="32" fill="#ffffff" fill-opacity="0.62"/>
</svg>
